<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"><meta name="application-name" content="Wiring UI"><title>Wiring UI</title><style>__INLINE_STYLES__</style></head>
<body><div id="app">
<header class="topbar"><span class="brand">Wiring UI</span><span id="document-name" class="document-title">Untitled</span><span class="spacer"></span>
<button data-command="new" title="Load a fresh editable example">New</button><button data-command="open">Open</button><button data-command="json">Save project</button><button data-command="html" title="Export this editor and document as one standalone HTML file">Download HTML</button><button data-command="png">PNG</button><button data-command="print">Print</button></header>
<nav class="toolbar" aria-label="Drawing tools"><button data-tool="select" class="active">Select</button><button data-tool="pan">Pan</button><button data-tool="wire">Cable</button><button data-tool="junction">Junction</button><button data-tool="component">Block</button><button data-tool="text">Text</button><button data-tool="rectangle">Rectangle</button><button data-tool="ellipse">Ellipse</button><button data-tool="line">Line</button><button data-tool="symbol">Symbol</button><select id="symbol-picker" aria-label="Choose schematic symbol"></select><button data-command="pdf">Import template</button><button data-command="remove-template">Remove template</button><button data-command="fit">Fit</button><span class="spacer"></span><label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><label><input type="checkbox" id="snap" checked>Snap</label><label><input type="checkbox" id="grid" checked>Grid</label></nav>
<main class="main"><section id="workspace" aria-label="Schematic canvas"><canvas id="grid-canvas" aria-hidden="true"></canvas><canvas id="editor-canvas" aria-label="Interactive schematic drawing surface"></canvas><button id="hover-add-pin" class="hover-add" hidden>+ Terminal</button></section><aside id="inspector" aria-label="Properties"></aside></main>
<footer id="status" class="status" role="status">Ready</footer></div>
<input id="file-input" type="file" accept=".json,.html,.wiring.json,application/json,text/html"><input id="template-input" type="file" accept="application/pdf,image/png,image/jpeg,image/webp,.pdf,.png,.jpg,.jpeg,.webp">
<script id="embedded-project" type="application/json"></script>
<script id="pdf-worker" type="text/plain">__INLINE_PDF_WORKER__</script>
<script type="module">__INLINE_JAVASCRIPT__</script>
</body></html>
