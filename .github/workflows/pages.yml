name: Build and deploy Wiring UI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiring-ui-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and pinned template
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Strict TypeScript, architecture guard and regressions
        run: bun run validate
      - name: Build self-contained HTML
        run: bun scripts/build.mts
      - name: Install Chromium for responsive audit
        run: bunx playwright install --with-deps chromium
      - name: Audit responsive layouts using pinned Pages template
        run: bun vendor/pages/src/cli.ts audit-mobile dist
      - name: Verify deployable artefact
        run: |
          test -s dist/index.html
          ! grep -Eq '__INLINE_(STYLES|JAVASCRIPT|PDF_WORKER)__' dist/index.html
          printf '' > dist/.nojekyll
      - name: Upload Pages build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
